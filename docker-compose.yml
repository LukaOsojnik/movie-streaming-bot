services:
  movie-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    network_mode: host
    volumes:
      - ${JELLYFIN_MEDIA_BASE}:${JELLYFIN_MEDIA_BASE}:z
      - ./data:/app/data:z

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${CLOUDFLARED_CONFIG_DIR:-~/.cloudflared}:/etc/cloudflared:z
    command: tunnel --config /etc/cloudflared/config.yml run
