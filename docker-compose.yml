services:
  movie-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    network_mode: host
    depends_on:
      - qbittorrent
    volumes:
      - ${JELLYFIN_MEDIA_BASE}:${JELLYFIN_MEDIA_BASE}:z
      - ./data:/app/data:z

  gluetun:
    image: qmcgaw/gluetun:latest
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${NORDVPN_WG_PRIVATE_KEY}
      - SERVER_COUNTRIES=${NORDVPN_COUNTRIES:-Switzerland}
      - TZ=${TZ:-Europe/Ljubljana}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:6881:6881"
      - "127.0.0.1:6881:6881/udp"
    volumes:
      - ./gluetun:/gluetun:z
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Ljubljana}
      - WEBUI_PORT=8080
    volumes:
      - ./qbit-config:/config:z
      - ${JELLYFIN_MEDIA_BASE}:${JELLYFIN_MEDIA_BASE}:z
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${CLOUDFLARED_CONFIG_DIR:-~/.cloudflared}:/etc/cloudflared:z
    command: tunnel --config /etc/cloudflared/config.yml run
